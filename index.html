<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Student Attendance</h1>
        <p>Student Attendance Management System</p>

        <div class="date-box">
            📅 <span id="currentDate"></span>
        </div>

        <div id="lockMessage"></div>
    </header>


    <!-- ADD STUDENT -->

    <section class="card">

        <h2>➕ Add Student</h2>

        <div class="form-row">

            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >

            <input
                type="text"
                id="rollNumber"
                placeholder="Enter roll number"
            >

            <button
                class="add-btn"
                onclick="addStudent()"
            >
                Add Student
            </button>

        </div>

    </section>


    <!-- ATTENDANCE -->

    <section class="card">

        <div class="attendance-header">

            <div>
                <h2>📝 Mark Attendance</h2>
                <p>Select subject, then mark attendance.</p>
            </div>

            <select id="subjectSelect">

                <option value="">
                    Select Subject
                </option>

                <option value="C Programming">
                    C Programming
                </option>

                <option value="Python">
                    Python
                </option>

                <option value="HTML & CSS">
                    HTML & CSS
                </option>

                <option value="JavaScript">
                    JavaScript
                </option>

                <option value="DBMS">
                    DBMS
                </option>

            </select>

        </div>


        <div class="search-box">

            <input
                type="text"
                id="searchStudent"
                placeholder="🔍 Search student..."
                oninput="displayStudents()"
            >

        </div>


        <div id="studentList">

            <div class="empty">
                No students added yet.
            </div>

        </div>

    </section>


    <!-- DASHBOARD -->

    <section class="dashboard">

        <div class="dashboard-card">
            <span>👨‍🎓</span>
            <h3>Total Students</h3>
            <strong id="totalStudents">0</strong>
        </div>

        <div class="dashboard-card">
            <span>📚</span>
            <h3>Total Attendance Records</h3>
            <strong id="totalClasses">0</strong>
        </div>

        <div class="dashboard-card">
            <span>📊</span>
            <h3>Overall Attendance</h3>
            <strong id="overallAttendance">0%</strong>
        </div>

    </section>

</div>


<script src="script.js"></script>

</body>
    </html>
